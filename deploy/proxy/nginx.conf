# proxy/nginx.yaml's: HTTPS with the certificate in OMEGACD_TLS_DIR, http redirected to it.
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 80;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	http2 on;
	ssl_certificate /etc/nginx/certs/fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/privkey.pem;
	client_max_body_size 5m; # a webhook's payload may be up to 5 MB

	# Docker's DNS, asked again: a recreated Control Plane has a new address, which nginx would otherwise never learn
	resolver 127.0.0.11 valid=10s;
	set $omegacd http://omegacd:8080;

	location / {
		proxy_pass $omegacd;
		proxy_http_version 1.1; # the Agents' WebSocket
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr; # replaced, not appended: a client can't add its own
		proxy_set_header X-Forwarded-Proto $scheme;
		# nginx's 60 s idle timeout stays: the Agents ping every 30 s, the event streams every 15 s (Q51)
	}
}
