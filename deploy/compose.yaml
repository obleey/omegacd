# OmegaCD's Control Plane, in a container. It deploys nothing itself: every Host, this machine included, runs an
# Agent (README → Hosts). See the README's Install section.
#   age-keygen -o age.key && chmod 600 age.key && touch known_hosts
#   docker compose up -d && docker compose logs omegacd | grep "initial admin password"
# Every setting below has a default; override with environment variables or a .env file next to this one.
name: omegacd

services:
  omegacd:
    image: ${OMEGACD_IMAGE:-ghcr.io/obleey/omegacd:latest} # or pin a release, e.g. ghcr.io/obleey/omegacd:0.1.0
    ports:
      - "${OMEGACD_PORT:-8080}:8080"
    volumes:
      - ${OMEGACD_DATA:-omegacd-data}:/data # a named volume, or a folder
      - ${OMEGACD_AGE_KEY:-./age.key}:/etc/omegacd/age.key:ro
      - ${OMEGACD_KNOWN_HOSTS:-./known_hosts}:/etc/omegacd/known_hosts:ro # for Git over SSH
    restart: unless-stopped

volumes:
  omegacd-data:
