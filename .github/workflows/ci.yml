name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The official image scans the full history with .gitleaks.toml; gitleaks-action fails
      # on the first push of a branch (it builds a commit range from the all-zero "before" SHA).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner -v

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-build
          path: web/build
          retention-days: 1

  go:
    name: Go (${{ matrix.runner }})
    needs: web
    strategy:
      fail-fast: false
      matrix: # Hosts are amd64 and arm64 Linux
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-build
          path: web/build
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal web/embed.go | tee /dev/stderr)"
      - name: generated protobuf code is up to date
        run: make proto && git diff --exit-code
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: mkdir cover && echo "COVERPKG=./cmd/...,./internal/..." >> "$GITHUB_ENV"
      # with coverage (Q96): the Coverage job merges every kind of test's
      - run: go test -race -coverpkg="$COVERPKG" -coverprofile=cover/unit.out ./...
      # Needs Docker (available on ubuntu-24.04); the remote Host tests run docker:dind --privileged.
      - run: go test -tags integration -coverpkg="$COVERPKG" -coverprofile=cover/integration.out ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-go-${{ matrix.runner }}
          path: cover


  e2e:
    name: End to end (${{ matrix.runner }})
    needs: web
    strategy:
      fail-fast: false
      matrix: # Hosts are amd64 and arm64 Linux
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-build
          path: web/build
      - name: age and sops (pinned, sops at the version in go.mod)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age
          arch=$(dpkg --print-architecture)
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.$arch
          case $arch in
            amd64) echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops" | sha256sum -c ;;
            arm64) echo "53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77  sops" | sha256sum -c ;;
          esac
          sudo install sops /usr/local/bin/sops && rm sops
      # the webhook test needs it; without it the test is skipped
      - run: docker compose -f test/e2e/forgejo.yaml up -d --wait
      # built with -cover: every process the scripts start writes its coverage to GOCOVERDIR (Q96)
      - run: |
          CGO_ENABLED=0 go build -cover -coverpkg=./cmd/...,./internal/... -o bin/omegacd ./cmd/omegacd
          mkdir -p cover/e2e
      - run: GOCOVERDIR=$PWD/cover/e2e test/e2e/run.sh
      - run: go tool covdata textfmt -i=cover/e2e -o cover/e2e.out && rm -r cover/e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-e2e-${{ matrix.runner }}
          path: cover

  engines:
    name: Agent engines (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix: # Hosts are amd64 and arm64 Linux
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # rootless engines need unprivileged user namespaces, which Ubuntu 24.04 restricts with AppArmor by default
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # the runner's own rootless Podman as the test's user, as test/linux.sh sets it up: Q58's rootless case; events in
      # a file, which its API service reads back for Self-Heal, and logs in files too (Podman can't follow journald logs
      # with events in a file)
      - name: Rootless Podman of the runner's user
        run: |
          command -v podman >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman >/dev/null; }
          mkdir -p ~/.config/containers/containers.conf.d
          printf '[engine]\nevents_logger = "file"\n\n[containers]\nlog_driver = "k8s-file"\n' > ~/.config/containers/containers.conf.d/events.conf
          dir=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
          sudo mkdir -p "$dir" && sudo chown "$(id -u):$(id -g)" "$dir" && mkdir -p "$dir/podman"
          echo "XDG_RUNTIME_DIR=$dir" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR=$dir nohup podman system service --time=0 "unix://$dir/podman/podman.sock" > /tmp/podman.log 2>&1 &
          for i in $(seq 30); do [ -S "$dir/podman/podman.sock" ] && exit; sleep 1; done; cat /tmp/podman.log; exit 1
      # the Agent's deploy path against rootful Docker, rootless Docker and rootless Podman (Q34, Q52), the same engines
      # test/linux.sh runs on every machine
      - run: mkdir cover && make test-engines ENGINES_ROOT=/tmp/omegacd-engines ENGINES="rootful rootless podman host-podman" COVER_DIR=$PWD/cover
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-engines-${{ matrix.runner }}
          path: cover

  coverage:
    name: Coverage
    needs: [go, e2e, engines]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the changed lines are diffed against main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-*
          path: cover
      # Q96: unit + integration + every engine + e2e, on amd64 and arm64; a block no test reaches fails where a line of
      # it changed against main (unless marked "coverage: unreachable, <reason>"), and the total may not drop
      - run: go run ./test/coverage -base origin/main -floor test/coverage-floor $(find cover -name '*.out')
