name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The official image scans the full history with .gitleaks.toml; gitleaks-action fails
      # on the first push of a branch (it builds a commit range from the all-zero "before" SHA).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner -v

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-build
          path: web/build
          retention-days: 1

  go:
    name: Go
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-build
          path: web/build
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal web/embed.go | tee /dev/stderr)"
      - name: generated protobuf code is up to date
        run: make proto && git diff --exit-code
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test -race ./...
      # Needs Docker (available on ubuntu-latest); the remote Host tests run docker:dind --privileged.
      - run: go test -tags integration ./...


  e2e:
    name: End to end
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-build
          path: web/build
      - name: age and sops (pinned, sops at the version in go.mod)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops" | sha256sum -c
          sudo install sops /usr/local/bin/sops && rm sops
      # the webhook test needs it; without it the test is skipped
      - run: docker compose -f test/e2e/forgejo.yaml up -d --wait
      - run: CGO_ENABLED=0 go build -o bin/omegacd ./cmd/omegacd
      - run: test/e2e/run.sh

  engines:
    name: Agent engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # rootless engines need unprivileged user namespaces, which Ubuntu 24.04 restricts with AppArmor by default
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # the Agent's deploy path against rootful Docker, rootless Docker and rootless Podman (Q34, Q52)
      - run: make test-engines ENGINES_ROOT=/tmp/omegacd-engines
