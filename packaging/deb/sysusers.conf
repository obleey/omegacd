# The package's users (Q242, Q255): the Control Plane's, and the Agent's in the docker group (created here when Docker
# comes later; its package keeps an existing group)
u omegacd - "OmegaCD Control Plane" /var/lib/omegacd /usr/sbin/nologin
u omegacd-agent - "OmegaCD Agent" /var/lib/omegacd-agent /usr/sbin/nologin
m omegacd-agent docker
