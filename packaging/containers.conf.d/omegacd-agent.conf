# For a Podman Host's Agent (Q246): into ~/.config/containers/containers.conf.d/ of the Agent's user. Self-Heal reads
# the engine's events, which Podman's API can't read back from the user's journal; with events in a file Podman can't
# follow journald logs, so logs go to files too, capped (k8s-file logs grow without limit; journald rotated them).
[engine]
events_logger = "file"

[containers]
log_driver = "k8s-file"
log_size_max = 10485760
