syntax = "proto3";

// Control Plane → Source Server, gRPC over mTLS (Q45). Rules: proto/README.md.
package omegacd.source.v1;

option go_package = "github.com/obleey/omegacd/internal/proto/source/v1;sourcev1";

service SourceService {
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc Render(RenderRequest) returns (RenderResponse);
  rpc Blob(BlobRequest) returns (stream BlobResponse);
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
}

message ResolveRequest {
  string repo_url = 1;
  string ref = 2;
}

message ResolveResponse {
  string revision = 1;
}

message RenderRequest {
  string repo_url = 1;
  string revision = 2;
  string path = 3;
  repeated string compose_files = 4;
  repeated string profiles = 5;
}

message RenderResponse {
  repeated File files = 1;
  repeated string compose_files = 2;
  repeated string warnings = 3;
  repeated string errors = 4;
}

message File {
  string path = 1;
  uint32 mode = 2;
  bytes sha256 = 3;
}

message BlobRequest {
  bytes sha256 = 1;
}

message BlobResponse {
  bytes data = 1;
}

message CheckAccessRequest {
  string repo_url = 1;
}

// Mirrors domain.RepoAccess.
message CheckAccessResponse {
  string access = 1;
  string credential_prefix = 2;
  string default_branch = 3;
  string message = 4;
}

message Credential {
  string url_prefix = 1;
  string username = 2;
  string password = 3; // write-only: never returned
  string ssh_private_key = 4; // write-only: never returned
  bool has_password = 5;
  bool has_ssh_key = 6;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
}

message PutCredentialRequest {
  Credential credential = 1;
}

message PutCredentialResponse {}

message DeleteCredentialRequest {
  string url_prefix = 1;
}

message DeleteCredentialResponse {}
