syntax = "proto3";

// Control Plane → Source Server, gRPC over mTLS (Q45). Mirrors domain.Source. Rules: proto/README.md.
package omegacd.source.v1;

option go_package = "github.com/obleey/omegacd/internal/proto/source/v1;sourcev1";

service SourceService {
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc Invalidate(InvalidateRequest) returns (InvalidateResponse);
  rpc Render(RenderRequest) returns (RenderResponse);
  rpc Blob(BlobRequest) returns (stream BlobResponse);
  rpc Diff(DiffRequest) returns (DiffResponse);
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
}

message ResolveRequest {
  string repo_url = 1;
  string ref = 2;
}

message ResolveResponse {
  string revision = 1;
}

message InvalidateRequest {
  string repo_url = 1;
}

message InvalidateResponse {}

message RenderRequest {
  string repo_url = 1;
  string revision = 2;
  string path = 3;
  repeated string compose_files = 4;
  repeated string profiles = 5;
  bool apps = 6; // an App of Apps: read its definitions
}

message RenderResponse {
  repeated File files = 1;
  string checksum = 2;
  repeated string warnings = 3;
  string invalid = 4; // why it can't be deployed, empty if it can
  repeated AppDefinition apps = 5;
}

message File {
  string path = 1;
  uint32 mode = 2; // Go fs.FileMode bits
  string sha256 = 3; // hex
}

// AppDefinition is a Child Application as declared in Git.
message AppDefinition {
  string name = 1;
  string kind = 2;
  string repo_url = 3;
  string path = 4;
  string target_revision = 5;
  repeated string compose_files = 6;
  repeated string profiles = 7;
  string host = 8;
  bool auto_sync = 9;
  bool self_heal = 10;
  bool prune = 11;
  bool prune_volumes = 12;
  bool adopt = 13;
}

message BlobRequest {
  string sha256 = 1;
}

message BlobResponse {
  bytes data = 1; // a chunk; the stream ends with the blob
}

message DiffRequest {
  string repo_url = 1;
  string from_revision = 2; // empty: from nothing
  string to_revision = 3;
  string path = 4;
}

message DiffResponse {
  string diff = 1;
}

message CheckAccessRequest {
  string repo_url = 1;
}

// Mirrors domain.RepoAccess.
message CheckAccessResponse {
  string access = 1;
  string credential_prefix = 2;
  string default_branch = 3;
  string message = 4;
}

message Credential {
  string url_prefix = 1;
  string username = 2;
  string password = 3; // write-only: never returned
  string ssh_private_key = 4; // write-only: never returned
  bool has_password = 5;
  bool has_ssh_key = 6;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
}

message PutCredentialRequest {
  Credential credential = 1;
}

message PutCredentialResponse {}

message DeleteCredentialRequest {
  string url_prefix = 1;
}

message DeleteCredentialResponse {}
