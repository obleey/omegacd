syntax = "proto3";

// Agent ↔ Control Plane messages, in binary WebSocket frames (Q20, Q27). Rules: proto/README.md.
package omegacd.agent.v1;

option go_package = "github.com/obleey/omegacd/internal/proto/agent/v1;agentv1";

// Envelope is every frame, either direction.
message Envelope {
  uint64 id = 1;
  uint64 reply_to = 2; // the id this answers, e.g. a LogChunk's LogsRequest
  oneof body {
    Hello hello = 10;
    Challenge challenge = 11;
    ChallengeResponse challenge_response = 12;
    DesiredState desired_state = 13;
    BlobRequest blob_request = 14;
    BlobChunk blob_chunk = 15;
    Resync resync = 16;
    StatusReport status_report = 17;
    SyncOperationReport sync_operation_report = 18;
    LogsRequest logs_request = 19;
    LogChunk log_chunk = 20;
    OutboxEntry outbox_entry = 21;
    Error error = 22;
    Enroll enroll = 23;
    EnrollmentStatus enrollment_status = 24;
    RotateKey rotate_key = 25;
    KeyRotation key_rotation = 26;
  }
}

// Hello comes before the ChallengeResponse; the Control Plane records it and serves Agents of its minor version and
// one behind (Q41).
message Hello {
  string agent_version = 1;
  uint32 protocol_version = 2;
  string engine = 3; // "docker" or "podman"
  string engine_version = 4;
  bool rootless = 5;
  string os = 6;
  string arch = 7;
  string hostname = 8;
}

message Challenge {
  bytes nonce = 1;
}

message ChallengeResponse {
  bytes public_key = 1; // ed25519, identifies the Host
  bytes signature = 2; // of "omegacd-agent-v1 challenge\n" followed by the nonce
}

// Enroll comes before the ChallengeResponse on an Agent's first connection (Q22): the invite registers the response's
// public key, and age_recipient (the Agent's Host Key, M2-05), to the Host the invite was made for.
message Enroll {
  string invite = 1;
  string age_recipient = 2;
}

// EnrollmentStatus answers an authenticated Agent: waiting for an admin to approve its key (Q28, Q74), and again once
// approved. Until then the Control Plane sends it nothing else.
message EnrollmentStatus {
  string host = 1;
  bool approved = 2;
  string fingerprint = 3; // of the public key, as the admin sees it: "SHA256:" and base64, like ssh-keygen -l
}

// RotateKey asks the Agent for a new signing key (Q76: an admin's click). It answers with a KeyRotation, which the
// Control Plane answers with an EnrollmentStatus carrying the new key's fingerprint (reply_to), or an Error.
message RotateKey {}

// KeyRotation is the Agent's new signing key, signed by the current one: "omegacd-agent-v1 rotate\n" followed by
// public_key. The Agent switches to it once the Control Plane has it; until it authenticates with it, the old key works
// too, so a crash in between locks nobody out.
message KeyRotation {
  bytes public_key = 1;
  bytes signature = 2;
}

message DesiredState {
  string app = 1;
  string revision = 2;
  repeated File files = 3;
  repeated string compose_files = 4;
  repeated string profiles = 5;
  // the Application's own root for its folder (Q57), absolute; empty: the Agent's work dir. The Agent writes only under
  // roots its own configuration allows (OMEGACD_AGENT_WORKDIR_ALLOW), whatever this says
  string work_dir = 6;
  // the Sync Operation this deploys (Q62: the Agent's log entries for it carry it as op); its SyncOperationReport
  // carries it back. 0: none (a resync, M3-06)
  uint64 op = 7;
  bool prune = 8;
  bool prune_volumes = 9;
  bool self_heal = 10; // the Agent self-heals the Application, online and offline (Q82)
  string parent = 11; // its App of Apps, if any
  // sha256 of the files (hex), as the Source Server rendered them: what the resync compares (M3-06)
  string checksum = 12;
  // take over a Compose project of the same name OmegaCD didn't start; without it the first deploy refuses one
  bool adopt = 13;
}

message File {
  string path = 1;
  uint32 mode = 2;
  bytes sha256 = 3;
}

message BlobRequest {
  repeated bytes sha256 = 1;
  // resume each blob from this offset (same index as sha256): what arrived before a reconnect isn't sent again; missing
  // or 0: from the start
  repeated uint64 offset = 2;
}

message BlobChunk {
  bytes sha256 = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message Resync {
  map<string, bytes> checksums = 1; // app → sha256 of its deployed file list
}

// Statuses are strings with the domain package's values (Healthy, Running, …).
message StatusReport {
  string app = 1;
  string revision = 2;
  string health = 3;
  bool drifted = 4;
  string message = 5;
}

message SyncOperationReport {
  string app = 1;
  string revision = 2;
  string phase = 3;
  string message = 4;
  // what started it on the Agent: "restore" (after a reboot), "self-heal", or "rollback" (run on the Host, Q25: the
  // Control Plane shows the Application rolled back on the Host and turns its Auto-Sync off)
  string trigger = 5;
  uint64 op = 6; // the DesiredState's op it answers; 0 for one the Agent started
}

message LogsRequest {
  string app = 1;
  string service = 2;
  uint32 tail = 3;
  bool follow = 4;
}

message LogChunk {
  bytes data = 1;
}

// OutboxEntry is something that happened while offline, sent on reconnect in seq order.
message OutboxEntry {
  uint64 seq = 1;
  int64 time_unix = 2;
  oneof event {
    StatusReport status_report = 3;
    SyncOperationReport sync_operation_report = 4;
  }
}

message Error {
  string message = 1;
}
