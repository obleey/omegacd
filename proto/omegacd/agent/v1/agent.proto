syntax = "proto3";

// Agent ↔ Control Plane messages, in binary WebSocket frames (Q20, Q27). Rules: proto/README.md.
package omegacd.agent.v1;

option go_package = "github.com/obleey/omegacd/internal/proto/agent/v1;agentv1";

// Envelope is every frame, either direction.
message Envelope {
  uint64 id = 1;
  uint64 reply_to = 2; // the id this answers, e.g. a LogChunk's LogsRequest
  oneof body {
    Hello hello = 10;
    Challenge challenge = 11;
    ChallengeResponse challenge_response = 12;
    DesiredState desired_state = 13;
    BlobRequest blob_request = 14;
    BlobChunk blob_chunk = 15;
    Resync resync = 16;
    StatusReport status_report = 17;
    SyncOperationReport sync_operation_report = 18;
    LogsRequest logs_request = 19;
    LogChunk log_chunk = 20;
    OutboxEntry outbox_entry = 21;
    Error error = 22;
    Enroll enroll = 23;
    EnrollmentStatus enrollment_status = 24;
    RotateKey rotate_key = 25;
    KeyRotation key_rotation = 26;
    OutboxAck outbox_ack = 27;
    RemoveApp remove_app = 28;
    AppRemoved app_removed = 29;
    RegistryAuthRequest registry_auth_request = 30;
    RegistryAuth registry_auth = 31;
    SyncProgress sync_progress = 32;
    LogsStop logs_stop = 33;
    DiffRequest diff_request = 34;
    DiffResult diff_result = 35;
  }
}

// Hello comes before the ChallengeResponse; the Control Plane records it and serves Agents of its minor version and
// one behind (Q41).
message Hello {
  string agent_version = 1;
  uint32 protocol_version = 2;
  string engine = 3; // "docker" or "podman"
  string engine_version = 4;
  bool rootless = 5;
  string os = 6;
  string arch = 7;
  string hostname = 8;
}

message Challenge {
  bytes nonce = 1;
}

message ChallengeResponse {
  bytes public_key = 1; // ed25519, identifies the Host
  bytes signature = 2; // of "omegacd-agent-v1 challenge\n" followed by the nonce
}

// Enroll comes before the ChallengeResponse on an Agent's first connection (Q22): the invite registers the response's
// public key, and age_recipient (the Agent's Host Key, M2-05), to the Host the invite was made for.
message Enroll {
  string invite = 1;
  string age_recipient = 2;
}

// EnrollmentStatus answers an authenticated Agent: waiting for an admin to approve its key (Q28, Q74), and again once
// approved. Until then the Control Plane sends it nothing else.
message EnrollmentStatus {
  string host = 1;
  bool approved = 2;
  string fingerprint = 3; // of the public key, as the admin sees it: "SHA256:" and base64, like ssh-keygen -l
}

// RotateKey asks the Agent for a new signing key (Q76: an admin's click). It answers with a KeyRotation, which the
// Control Plane answers with an EnrollmentStatus carrying the new key's fingerprint (reply_to), or an Error.
message RotateKey {}

// KeyRotation is the Agent's new signing key, signed by the current one: "omegacd-agent-v1 rotate\n" followed by
// public_key. The Agent switches to it once the Control Plane has it; until it authenticates with it, the old key works
// too, so a crash in between locks nobody out.
message KeyRotation {
  bytes public_key = 1;
  bytes signature = 2;
}

message DesiredState {
  string app = 1;
  string revision = 2;
  repeated File files = 3;
  repeated string compose_files = 4;
  repeated string profiles = 5;
  // the Application's own root for its folder (Q57), absolute; empty: the Agent's work dir. The Agent writes only under
  // roots its own configuration allows (OMEGACD_AGENT_WORKDIR_ALLOW), whatever this says
  string work_dir = 6;
  // the Sync Operation this deploys (Q62: the Agent's log entries for it carry it as op); its SyncOperationReport
  // carries it back. 0: none (a resync, M3-06)
  uint64 op = 7;
  bool prune = 8;
  bool prune_volumes = 9;
  bool self_heal = 10; // the Agent self-heals the Application, online and offline (Q82)
  string parent = 11; // its App of Apps, if any
  // sha256 of the files (hex), as the Source Server rendered them: what the resync compares (M3-06)
  string checksum = 12;
  // take over a Compose project of the same name OmegaCD didn't start; without it the first deploy refuses one
  bool adopt = 13;
}

message File {
  string path = 1;
  uint32 mode = 2;
  bytes sha256 = 3;
}

message BlobRequest {
  repeated bytes sha256 = 1;
  // resume each blob from this offset (same index as sha256): what arrived before a reconnect isn't sent again; missing
  // or 0: from the start
  repeated uint64 offset = 2;
}

message BlobChunk {
  bytes sha256 = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message Resync {
  // app → its deployed Revision's checksum (DesiredState.checksum): a Desired State in flight the Agent lacks goes again
  map<string, bytes> checksums = 1;
}

// Statuses are strings with the domain package's values (Healthy, Running, …).
// StatusReport is an Application's state as its Agent sees it, sent whenever it changes (engine events, after a Sync,
// on connect; M4-02): the Control Plane keeps the latest, with its time, as the last-known state while the Host is
// offline. The JSON fields are the domain package's types (the UI reads them as they are; both ends are the same
// release, or one minor apart, Q41).
message StatusReport {
  string app = 1;
  string revision = 2;
  string health = 3;
  bool drifted = 4;
  string message = 5;
  bytes live_state = 6; // JSON domain.LiveState: services, containers, resources (networks, volumes, files)
  bytes drift = 7; // JSON []domain.ServiceDiff: how what runs differs from the deployed Revision
  bytes details = 8; // JSON map["kind/name"]map[string]string: each volume's and network's details
  int64 time_unix = 9;
}

message SyncOperationReport {
  string app = 1;
  string revision = 2;
  string phase = 3;
  string message = 4;
  // what started it on the Agent: "restore" (after a reboot), "self-heal", or "rollback" (run on the Host, Q25: the
  // Control Plane shows the Application rolled back on the Host and turns its Auto-Sync off)
  string trigger = 5;
  uint64 op = 6; // the DesiredState's op it answers; 0 for one the Agent started
  string checksum = 7; // the deployed Revision's (DesiredState.checksum): what Sync Status compares with the target
}

message LogsRequest {
  string app = 1;
  string service = 2;
  uint32 tail = 3;
  bool follow = 4;
}

// LogChunk answers a LogsRequest (reply_to), as many as it takes; the last one has done set, and error if it failed.
message LogChunk {
  bytes data = 1;
  bool done = 2;
  string error = 3;
}

// LogsStop ends a LogsRequest (reply_to) that follows: the viewer went away.
message LogsStop {}

// OutboxEntry is something that happened while offline, sent on reconnect in seq order.
message OutboxEntry {
  uint64 seq = 1;
  int64 time_unix = 2;
  oneof event {
    StatusReport status_report = 3;
    SyncOperationReport sync_operation_report = 4;
    AppRemoved app_removed = 5;
  }
}

// RemoveApp has the Agent remove an Application (Q83): its containers and networks, with volumes only when asked; with
// keep_containers it only forgets the Application (no Self-Heal, no restore) and leaves its containers and folder.
// Answered by AppRemoved (reply_to).
message RemoveApp {
  string app = 1;
  bool volumes = 2;
  bool keep_containers = 3;
}

// AppRemoved answers a RemoveApp; error empty when it was removed. One whose answer couldn't be sent goes to the outbox.
message AppRemoved {
  string app = 1;
  string error = 2;
}

// RegistryAuthRequest asks for the credentials of the registries a Sync's images come from (Q85), before pulling.
message RegistryAuthRequest {
  repeated string registries = 1;
}

// RegistryAuth answers it (reply_to) with the credentials the Control Plane has for those registries, each
// age-encrypted to the Host's Host Key: only that Agent decrypts them, in memory, for that Sync (Q86).
message RegistryAuth {
  repeated SealedCredential credentials = 1;
}

message SealedCredential {
  string registry = 1;
  bytes sealed = 2; // age ciphertext of {"username": ..., "password": ...}
}

// SyncProgress is a Sync's progress as the Agent runs it (Q87): pulling, creating, started, …
message SyncProgress {
  string app = 1;
  uint64 op = 2;
  string resource = 3;
  string status = 4;
  string text = 5;
}

// DiffRequest asks the Agent how a Revision not deployed yet would change what runs (M4-11): it stages the files in
// its work dir (RAM by default, Q19), decrypts and diffs them as if in the Application's folder, never deploys, and
// removes the staged files. Answered by DiffResult (reply_to). The Desired State's op is 0.
message DiffRequest {
  DesiredState desired_state = 1;
}

// DiffResult answers a DiffRequest: services is JSON []domain.ServiceDiff; error says why there is none.
message DiffResult {
  bytes services = 1;
  string error = 2;
}

// OutboxAck tells the Agent the Control Plane has its entries up to seq: it deletes them. An entry sent again (no ack
// arrived) is acknowledged again but applied once (M3-06).
message OutboxAck {
  uint64 seq = 1;
}

message Error {
  string message = 1;
}
