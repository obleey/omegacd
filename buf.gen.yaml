# Plugin versions are pinned here; protoc-gen-go matches google.golang.org/protobuf in go.mod.
version: v2
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12]
    out: internal/proto
    opt: module=github.com/obleey/omegacd/internal/proto
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2]
    out: internal/proto
    opt: module=github.com/obleey/omegacd/internal/proto
