<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<title>OmegaCD</title>
		<script>
			// apply the stored theme before first paint (see ThemeToggle.svelte)
			try {
				const t = localStorage.getItem('omegacd.theme');
				if (t === 'light') document.documentElement.setAttribute('data-theme', 'latte');
				if (t === 'dark') document.documentElement.setAttribute('data-theme', 'mocha');
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
